<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#09090e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pardais Party" />
    <link rel="manifest" href="/manifest.json?v=7" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=7" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=7" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-192.png?v=7" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-192.png?v=7" />
    <link rel="shortcut icon" href="/icon-192.png?v=7" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=7" />
    <title>Pardais Party — Where Every Party Comes Alive</title>
  </head>
  <body class="bg-[#09090e] text-white overflow-x-hidden antialiased select-none">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(
            function(reg) { console.log('PWA ServiceWorker registered successfully:', reg.scope); },
            function(err) { console.warn('PWA ServiceWorker registration failed:', err); }
          );
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  
<style id="pardais-auth-gate-style">
#pardais-auth-gate{position:fixed;inset:0;z-index:2147483647;background:linear-gradient(135deg,#080811,#17102b,#071b2f);display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;color:#fff;overflow:auto}
#pardais-auth-card{width:min(430px,100%);background:rgba(20,18,31,.98);border:1px solid rgba(255,0,153,.55);border-radius:24px;padding:28px;box-sizing:border-box;text-align:center;box-shadow:0 20px 70px rgba(0,0,0,.6)}
#pardais-auth-card h1{font-size:27px;margin:8px 0 10px;font-weight:800}
#pardais-auth-card p{color:#aaa5b5;font-size:14px;line-height:1.5}
#pardais-auth-card input{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #3b3747;background:#0d0c13;color:#fff;outline:none;font-size:16px;margin-top:8px;display:block}
#pardais-auth-card input:focus{border-color:#ff0b8a;box-shadow:0 0 0 3px rgba(255,11,138,.12)}
#pardais-auth-card button{width:100%;box-sizing:border-box;padding:14px 16px;border:0;border-radius:12px;background:linear-gradient(90deg,#ff0b8a,#9b30ff);color:#fff;font-weight:800;cursor:pointer;font-size:15px;margin-top:10px}
#pardais-auth-card button:disabled{opacity:.55;cursor:not-allowed}
#pardais-google-button{min-height:44px;display:flex;justify-content:center}
#pardais-auth-or{color:#777185;margin:18px 0;font-weight:700}
#pardais-email-section{display:block;text-align:left}
#pardais-email-label,#pardais-otp-label{display:block;font-size:12px;font-weight:800;color:#c7c1d0;margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em}
#pardais-otp-row{display:block;text-align:left;margin-top:14px}
#pardais-otp{letter-spacing:.3em;text-align:center;font-size:20px;font-weight:800}
#pardais-resend{background:transparent;border:1px solid #3b3747;color:#d7d1df;margin-top:8px}
#pardais-auth-msg{margin-top:14px;color:#ff8fbc;font-size:13px;min-height:20px;line-height:1.4}
#pardais-auth-setup button{width:100%;margin-top:12px}
#pardais-auth-setup{text-align:left}
#pardais-auth-login>div{display:block}
</style>
<div id="pardais-auth-gate">
  <div id="pardais-auth-card">
    <div style="font-size:40px;text-align:center">🎉</div>
    <h1 id="pardais-auth-title">Welcome to Pardais Party</h1>
    <p id="pardais-auth-subtitle">Login to your existing account or create a new one.</p>
    <div id="pardais-auth-tabs" style="display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#100e18;border-radius:12px;padding:4px;margin:0 0 18px">
      <button id="pardais-tab-login" type="button" style="margin:0;background:linear-gradient(90deg,#ff0b8a,#9b30ff)">Login</button>
      <button id="pardais-tab-signup" type="button" style="margin:0;background:transparent;border:1px solid #3b3747">Sign Up</button>
    </div>

    <section id="pardais-login-panel">
      <label>Email or Username</label>
      <input id="pardais-login-identifier" type="text" placeholder="Email or @username" autocomplete="username">
      <label>Password</label>
      <input id="pardais-login-password" type="password" placeholder="Your password" autocomplete="current-password">
      <button id="pardais-login-btn" type="button">Login</button>
      <button id="pardais-forgot-btn" type="button" style="background:transparent;border:1px solid #3b3747">Forgot Password?</button>
    </section>

    <section id="pardais-signup-panel" style="display:none;text-align:left">
      <div id="pardais-signup-email">
        <label>Email Address</label>
        <input id="pardais-signup-email-input" type="email" placeholder="name@example.com" autocomplete="email">
        <button id="pardais-signup-send" type="button">Send Verification Code</button>
        <div style="display:flex;align-items:center;gap:10px;margin:14px 0 10px;color:#777185;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em">
          <span style="height:1px;background:#ffffff18;flex:1"></span><span>or</span><span style="height:1px;background:#ffffff18;flex:1"></span>
        </div>
        <button id="pardais-google-signup" type="button" style="background:#fff;color:#202124;border:1px solid #dadce0;display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:800;min-height:50px;margin-top:0;box-shadow:0 4px 18px rgba(0,0,0,.25)">
          <span style="font-family:Arial,sans-serif;font-size:24px;font-weight:900;color:#4285F4;line-height:1">G</span>
          <span>Continue with Google</span>
        </button>
      </div>
      <div id="pardais-signup-otp" style="display:none">
        <label>Verification Code</label>
        <input id="pardais-signup-otp-input" type="text" maxlength="6" placeholder="6-digit code" inputmode="numeric" autocomplete="one-time-code">
        <button id="pardais-signup-verify" type="button">Verify Email</button>
        <button id="pardais-signup-resend" type="button" style="background:transparent;border:1px solid #3b3747" disabled>Resend Code (60s)</button>
      </div>
      <div id="pardais-auth-setup" style="display:none">
        <label>Full Name</label>
        <input id="pardais-name" placeholder="Your name" autocomplete="name">
        <label>Username</label>
        <input id="pardais-username" placeholder="@username" autocomplete="username">
        <label>Create Password</label>
        <input id="pardais-create-password" type="password" placeholder="At least 6 characters" autocomplete="new-password">
        <label>Confirm Password</label>
        <input id="pardais-confirm-password" type="password" placeholder="Repeat password" autocomplete="new-password">
        <button id="pardais-save-profile" type="button">Create Pardais Account</button>
      </div>
    </section>

    <section id="pardais-forgot-panel" style="display:none;text-align:left">
      <label>Registered Email</label>
      <input id="pardais-forgot-email" type="email" placeholder="name@example.com" autocomplete="email">
      <button id="pardais-forgot-send" type="button">Send Recovery Code</button>
      <div id="pardais-forgot-otp" style="display:none">
        <label>Recovery Code</label>
        <input id="pardais-forgot-code" type="text" maxlength="6" placeholder="6-digit code" inputmode="numeric">
        <label>New Password</label>
        <input id="pardais-new-password" type="password" placeholder="At least 6 characters" autocomplete="new-password">
        <button id="pardais-reset-btn" type="button">Reset Password & Login</button>
      </div>
      <button id="pardais-back-login" type="button" style="background:transparent;border:1px solid #3b3747">Back to Login</button>
    </section>
    <div id="pardais-auth-msg"></div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const pardaisFirebaseConfig = {
  apiKey: "AIzaSyDUcaaRaU2ZJNUp90CMdl9gER_0oe1Db_E",
  authDomain: "pardais-party-production.firebaseapp.com",
  projectId: "pardais-party-production",
  storageBucket: "pardais-party-production.firebasestorage.app",
  messagingSenderId: "496371999211",
  appId: "1:496371999211:web:3caed46eb0e946c1c9b9ae"
};
const pardaisFirebaseApp = initializeApp(pardaisFirebaseConfig, "pardais-auth-gate");
const pardaisFirebaseAuth = getAuth(pardaisFirebaseApp);
const pardaisGoogleProvider = new GoogleAuthProvider();
pardaisGoogleProvider.setCustomParameters({ prompt: "select_account" });

(function(){
  const API="https://api.pardaisparty.soulverseapps.com";
  const gate=document.getElementById("pardais-auth-gate");
  const msg=document.getElementById("pardais-auth-msg");
  const loginPanel=document.getElementById("pardais-login-panel");
  const signupPanel=document.getElementById("pardais-signup-panel");
  const forgotPanel=document.getElementById("pardais-forgot-panel");
  const tLogin=document.getElementById("pardais-tab-login"), tSignup=document.getElementById("pardais-tab-signup");
  let signupEmail="", forgotEmail="", timer=null;
  const token=()=>localStorage.getItem("pardais_auth_token");
  const saveToken=t=>localStorage.setItem("pardais_auth_token",t);
  const setMsg=x=>msg.textContent=x||"";
  async function post(path,body){
    let r; try{r=await fetch(API+path,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(body)})}
    catch(e){throw new Error("Unable to connect to Pardais Party server.")}
    const d=await r.json().catch(()=>({})); if(!r.ok)throw new Error(d.error||d.message||("Server error ("+r.status+")")); return d;
  }
  function finish(d){if(d.token)saveToken(d.token);window.__pardaisAuthenticatedUser=d.user||{};gate.remove();}
  function tab(name){
    loginPanel.style.display=name==="login"?"block":"none";
    signupPanel.style.display=name==="signup"?"block":"none";
    forgotPanel.style.display=name==="forgot"?"block":"none";
    tLogin.style.background=name==="login"?"linear-gradient(90deg,#ff0b8a,#9b30ff)":"transparent";
    tSignup.style.background=name==="signup"?"linear-gradient(90deg,#ff0b8a,#9b30ff)":"transparent";
    document.getElementById("pardais-auth-title").textContent=name==="login"?"Welcome Back":name==="signup"?"Create Your Account":"Forgot Password";
    document.getElementById("pardais-auth-subtitle").textContent=name==="login"?"Login with your email or username and password.":name==="signup"?"Sign up once. Your Pardais ID and profile stay permanent.":"Recover your existing account with one email code.";
    setMsg("");
  }
  tLogin.onclick=()=>tab("login"); tSignup.onclick=()=>tab("signup");

  document.getElementById("pardais-login-btn").onclick=async()=>{
    const identifier=document.getElementById("pardais-login-identifier").value.trim();
    const password=document.getElementById("pardais-login-password").value;
    if(!identifier||!password){setMsg("Enter your email/username and password.");return}
    try{setMsg("Signing in…");finish(await post("/api/v1/auth/password-login",{identifier,password}))}
    catch(e){setMsg(e.message||"Incorrect email/username or password.")}
  };
  document.getElementById("pardais-login-password").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("pardais-login-btn").click()});

  async function continueWithGoogle(){
    const b=document.getElementById("pardais-google-signup");
    try{
      b.disabled=true; b.textContent="Connecting to Google…"; setMsg("Opening Google account chooser…");
      let result=null;
      try{ result=await signInWithPopup(pardaisFirebaseAuth,pardaisGoogleProvider); }
      catch(popupErr){
        console.warn("Google popup failed, using redirect",popupErr);
        await signInWithRedirect(pardaisFirebaseAuth,pardaisGoogleProvider);
        return;
      }
      const u=result&&result.user;
      if(!u||!u.email) throw new Error("Google account email was not returned.");
      const idToken=await u.getIdToken();
      const d=await post("/api/v1/auth/google-login",{
        uid:u.uid,email:u.email,displayName:u.displayName||u.email.split("@")[0],photoURL:u.photoURL||"",idToken
      });
      if(!d||!d.token||!d.user) throw new Error("Google account could not be registered on Pardais Party.");
      saveToken(d.token);
      if(d.isNewUser || !d.user.fullName || d.user.fullName==="Pardais Member"){
        signupEmail=u.email.toLowerCase();
        document.getElementById("pardais-signup-email").style.display="none";
        document.getElementById("pardais-signup-otp").style.display="none";
        document.getElementById("pardais-auth-setup").style.display="block";
        document.getElementById("pardais-name").value=u.displayName||"";
        document.getElementById("pardais-username").value=(u.email.split("@")[0]||"").replace(/[^a-zA-Z0-9_]/g,"_").slice(0,20);
        setMsg("Google verified. Complete your Pardais registration.");
        b.disabled=false; b.innerHTML='<span style="font-family:Arial,sans-serif;font-size:24px;font-weight:900;color:#4285F4;line-height:1">G</span><span>Continue with Google</span>';
        return;
      }
      finish(d);
    }catch(e){
      setMsg(e.message||"Could not continue with Google.");
      b.disabled=false; b.innerHTML='<span style="font-family:Arial,sans-serif;font-size:24px;font-weight:900;color:#4285F4;line-height:1">G</span><span>Continue with Google</span>';
    }
  }
  document.getElementById("pardais-google-signup").onclick=continueWithGoogle;

  async function handleGoogleRedirect(){
    try{
      const result=await getRedirectResult(pardaisFirebaseAuth);
      if(!result||!result.user)return;
      const u=result.user; const idToken=await u.getIdToken();
      const d=await post("/api/v1/auth/google-login",{uid:u.uid,email:u.email,displayName:u.displayName||u.email.split("@")[0],photoURL:u.photoURL||"",idToken});
      if(!d||!d.token||!d.user)throw new Error("Google account could not be registered on Pardais Party.");
      saveToken(d.token);
      if(d.isNewUser || !d.user.fullName || d.user.fullName==="Pardais Member"){
        signupEmail=u.email.toLowerCase(); document.getElementById("pardais-signup-email").style.display="none"; document.getElementById("pardais-signup-otp").style.display="none"; document.getElementById("pardais-auth-setup").style.display="block"; document.getElementById("pardais-name").value=u.displayName||""; document.getElementById("pardais-username").value=(u.email.split("@")[0]||"").replace(/[^a-zA-Z0-9_]/g,"_").slice(0,20); setMsg("Google verified. Complete your Pardais registration.");
      } else finish(d);
    }catch(e){console.warn("Google redirect result",e);setMsg(e.message||"Could not continue with Google.");}
  }
  handleGoogleRedirect();

  document.getElementById("pardais-signup-send").onclick=async()=>{
    const email=document.getElementById("pardais-signup-email-input").value.trim().toLowerCase();
    if(!email||!email.includes("@")){setMsg("Enter a valid email address.");return}
    try{
      const st=await post("/api/v1/auth/email-status",{email});
      if(st.exists&&!st.needsPassword){setMsg("This email already has an account. Please use Login.");tab("login");document.getElementById("pardais-login-identifier").value=email;return}
      signupEmail=email; await post("/api/v1/auth/send-email-otp",{email});
      document.getElementById("pardais-signup-email").style.display="none";
      document.getElementById("pardais-signup-otp").style.display="block";
      setMsg("Verification code sent. Check your email.");document.getElementById("pardais-signup-otp-input").focus();startResend();
    }catch(e){setMsg(e.message||"Could not send verification code.")}
  };
  function startResend(){const b=document.getElementById("pardais-signup-resend");let s=60;b.disabled=true;b.textContent="Resend Code ("+s+"s)";clearInterval(timer);timer=setInterval(()=>{if(--s<=0){clearInterval(timer);b.disabled=false;b.textContent="Resend Code"}else b.textContent="Resend Code ("+s+"s)"},1000)}
  document.getElementById("pardais-signup-resend").onclick=async()=>{try{await post("/api/v1/auth/send-email-otp",{email:signupEmail});setMsg("New verification code sent.");startResend()}catch(e){setMsg(e.message)}};

  document.getElementById("pardais-signup-verify").onclick=async()=>{
    const code=document.getElementById("pardais-signup-otp-input").value.trim();
    if(code.length!==6){setMsg("Enter the 6-digit verification code.");return}
    try{
      const d=await post("/api/v1/auth/verify-email-otp",{email:signupEmail,otp:code});
      if(d.needsPassword||d.isNewUser){if(d.token)saveToken(d.token);document.getElementById("pardais-signup-otp").style.display="none";document.getElementById("pardais-auth-setup").style.display="block";setMsg("Email verified. Create your permanent Pardais account.")}
      else finish(d);
    }catch(e){setMsg(e.message||"Verification failed.")}
  };

  document.getElementById("pardais-save-profile").onclick=async()=>{
    const name=document.getElementById("pardais-name").value.trim(), username=document.getElementById("pardais-username").value.trim().replace(/^@/,"");
    const password=document.getElementById("pardais-create-password").value, confirm=document.getElementById("pardais-confirm-password").value;
    if(!name||username.length<3||password.length<6||password!==confirm){setMsg("Enter name, username, matching password (6+ characters).");return}
    try{
      const t=token();
      const p=await fetch(API+"/api/v1/auth/set-password",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},body:JSON.stringify({password})});
      const pd=await p.json().catch(()=>({}));if(!p.ok)throw new Error(pd.error||"Could not create password.");
      const r=await fetch(API+"/api/v1/auth/setup-profile",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},body:JSON.stringify({fullName:name,username})});
      const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Could not save profile.");
      finish({token:t,user:d.user});
    }catch(e){setMsg(e.message||"Could not create account.")}
  };

  document.getElementById("pardais-forgot-btn").onclick=()=>tab("forgot");
  document.getElementById("pardais-back-login").onclick=()=>tab("login");
  document.getElementById("pardais-forgot-send").onclick=async()=>{
    forgotEmail=document.getElementById("pardais-forgot-email").value.trim().toLowerCase();
    if(!forgotEmail||!forgotEmail.includes("@")){setMsg("Enter your registered email.");return}
    try{await post("/api/v1/auth/forgot-password",{email:forgotEmail});document.getElementById("pardais-forgot-otp").style.display="block";setMsg("Recovery code sent. Check your email.");}catch(e){setMsg(e.message)}
  };
  document.getElementById("pardais-reset-btn").onclick=async()=>{
    const otp=document.getElementById("pardais-forgot-code").value.trim(), password=document.getElementById("pardais-new-password").value;
    if(otp.length!==6||password.length<6){setMsg("Enter the 6-digit code and a 6+ character password.");return}
    try{finish(await post("/api/v1/auth/reset-password",{email:forgotEmail,otp,password}))}catch(e){setMsg(e.message||"Could not reset password.")}
  };
  async function restore(){const t=token();if(!t)return;try{const r=await fetch(API+"/api/v1/auth/me",{headers:{Authorization:"Bearer "+t}});if(!r.ok)throw new Error();const d=await r.json();window.__pardaisAuthenticatedUser=d.user;gate.remove()}catch(e){localStorage.removeItem("pardais_auth_token")}}
  restore();
})();
</script>
</body>
</html>
