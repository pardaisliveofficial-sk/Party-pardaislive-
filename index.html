#pardais-google-button{min-height:44px;display:flex;justify-content:center}

#pardais-email-section{display:block;text-align:left}

#pardais-auth-setup button{width:100%;margin-top:12px}\n#pardais-auth-card .pardais-password-wrap{position:relative;width:100%;margin-top:8px}\n#pardais-auth-card .pardais-password-wrap input{margin-top:0;padding-right:14px}\n#pardais-auth-card .pardais-password-switch{display:inline-flex;align-items:center;gap:7px;margin-top:6px;padding:5px 8px;border:1px solid #3b3747;border-radius:7px;background:#100e18;color:#c7c1d0;font-size:12px;font-weight:700;cursor:pointer;user-select:none}\n#pardais-auth-card .pardais-password-switch input{width:14px!important;height:14px!important;margin:0!important;padding:0!important;display:block!important;accent-color:#ff0b8a;box-shadow:none!important}\n#pardais-auth-card .pardais-password-switch span{line-height:1.2}\n#pardais-google-button{background:#fff!important;color:#202124!important;border:1px solid #dadce0!important;font-weight:700!important}\n#pardais-google-button:hover{background:#f8f9fa!important}\n#pardais-google-button .google-g{font-weight:900;font-size:19px;line-height:1;color:#4285f4}
#pardais-auth-setup{text-align:left}
#pardais-auth-login>div{display:block}

    <h1 id="pardais-auth-title">Welcome to Pardais Party</h1>
    <p id="pardais-auth-subtitle">Login to your existing account or create a new one.</p>
    <div id="pardais-auth-tabs" style="display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#100e18;border-radius:12px;padding:4px;margin:0 0 18px">
      <button id="pardais-tab-login" type="button" style="margin:0;background:linear-gradient(90deg,#ff0b8a,#9b30ff)">Login</button>

<script>
(function(){
  var b=document.getElementById("pardais-boot-splash");
  function hide(){ if(b) b.classList.add("pardais-boot-hide"); }
  window.addEventListener("pardais:app-ready",function(){ setTimeout(hide,150); },{once:true});
  setTimeout(hide,5000);
})();
</script>
<script type="module">
(function(){
  const API="https://api.pardaisparty.soulverseapps.com";
  const gate=document.getElementById("pardais-auth-gate");
  const msg=document.getElementById("pardais-auth-msg");
  const loginPanel=document.getElementById("pardais-login-panel");
  const signupPanel=document.getElementById("pardais-signup-panel");
  const forgotPanel=document.getElementById("pardais-forgot-panel");
  const tLogin=document.getElementById("pardais-tab-login");
  const tSignup=document.getElementById("pardais-tab-signup");
  let signupEmail="", loginEmail="", signupTimer=null, loginTimer=null;
  const token=()=>localStorage.getItem("pardais_auth_token");
  const saveToken=t=>localStorage.setItem("pardais_auth_token",t);
  const setMsg=x=>msg.textContent=x||"";

  async function post(path,body,authToken,timeoutMs=30000){
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),timeoutMs);
    try{
      const headers={"Content-Type":"application/json","Accept":"application/json"};
      if(authToken) headers.Authorization="Bearer "+authToken;
      const r=await fetch(API+path,{method:"POST",headers,body:JSON.stringify(body),signal:controller.signal});
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error||d.message||("Server error ("+r.status+")"));
      return d;
    }catch(e){
      if(e&&e.name==="AbortError") throw new Error("Verification request timed out. Please try again.");
      throw e;
    }finally{clearTimeout(timeout)}
  }
  function finish(d){
    if(d.token) saveToken(d.token);
    window.__pardaisAuthenticatedUser=d.user||{};
    gate.remove();
  }
  function tab(name){
    loginPanel.style.display=name==="login"?"block":"none";
    signupPanel.style.display=name==="signup"?"block":"none";
    forgotPanel.style.display="none";
    tLogin.style.background=name==="login"?"linear-gradient(90deg,#ff0b8a,#9b30ff)":"transparent";
    tSignup.style.background=name==="signup"?"linear-gradient(90deg,#ff0b8a,#9b30ff)":"transparent";
    document.getElementById("pardais-auth-title").textContent=name==="login"?"Welcome Back":"Create Your Account";
    document.getElementById("pardais-auth-subtitle").textContent=name==="login"?"Login securely with your registered email OTP.":"Sign up once. Your Pardais ID and profile stay permanent.";
    setMsg("");
  }
  tLogin.onclick=()=>tab("login");
  tSignup.onclick=()=>tab("signup");

  function startTimer(button,seconds){
    let s=seconds; button.disabled=true; button.textContent="Resend Code ("+s+"s)";
    const old=button.dataset.timer; if(old) clearInterval(Number(old));
    const id=setInterval(()=>{
      s--;
      if(s<=0){clearInterval(id);button.dataset.timer="";button.disabled=false;button.textContent="Resend Code";}
      else button.textContent="Resend Code ("+s+"s)";
    },1000);
    button.dataset.timer=String(id);
  }

  // Login: registered email -> real email OTP -> direct login.
  document.getElementById("pardais-login-send").onclick=async()=>{
    const btn=document.getElementById("pardais-login-send");
    const email=document.getElementById("pardais-login-email").value.trim().toLowerCase();
    if(!email||!email.includes("@")){setMsg("Enter your registered email address.");return;}
    btn.disabled=true; const old=btn.textContent; btn.textContent="Sending…";
    try{
      const d=await post("/api/v1/auth/send-login-email-otp",{email},null,30000);
      if(!d?.success) throw new Error(d?.error||"Could not send login code.");
      loginEmail=email;
      document.getElementById("pardais-login-email-step").style.display="none";
      document.getElementById("pardais-login-otp-step").style.display="block";
      document.getElementById("pardais-login-otp").focus();
      setMsg("Login code sent to your email.");
      startTimer(document.getElementById("pardais-login-resend"),60);
    }catch(e){setMsg(e.message||"Could not send login code.");}
    finally{btn.disabled=false;btn.textContent=old;}
  };

  async function verifyLoginCode(){
    const btn=document.getElementById("pardais-login-verify");
    const code=document.getElementById("pardais-login-otp").value.trim().replace(/\D/g,"");
    if(code.length!==6){setMsg("Enter the 6-digit code from your email.");return;}
    btn.disabled=true; const old=btn.textContent; btn.textContent="Verifying…";
    try{
      let d;
      try {
        d=await post("/api/v1/auth/verify-login-email-otp",{email:loginEmail,otp:code},null,20000);
      } catch (verifyErr) {
        try {
          const recovery=await post("/api/v1/auth/recover-login-email-session",{email:loginEmail,otp:code},null,10000);
          if(recovery?.success) d=recovery;
          else throw verifyErr;
        } catch { throw verifyErr; }
      }
      if(!d?.success||!d?.token||!d?.user) throw new Error(d?.error||"Invalid or expired login code.");
      finish(d);
    }catch(e){setMsg(e.message||"Login verification failed.");}
    finally{btn.disabled=false;btn.textContent=old;}
  }
  document.getElementById("pardais-login-verify").onclick=verifyLoginCode;
  document.getElementById("pardais-login-otp").addEventListener("keydown",e=>{if(e.key==="Enter")verifyLoginCode()});
  document.getElementById("pardais-login-resend").onclick=async()=>{
    try{
      const d=await post("/api/v1/auth/send-login-email-otp",{email:loginEmail},null,30000);
      if(!d?.success) throw new Error(d?.error||"Could not resend login code.");
      document.getElementById("pardais-login-otp").value="";
      setMsg("New login code sent to your email.");
      startTimer(document.getElementById("pardais-login-resend"),60);
    }catch(e){setMsg(e.message||"Could not resend login code.");}
  };

  // Signup: registered email is locked and never receives a signup OTP.
  document.getElementById("pardais-signup-send").onclick=async()=>{
    const btn=document.getElementById("pardais-signup-send");
    const email=document.getElementById("pardais-signup-email-input").value.trim().toLowerCase();
    if(!email||!email.includes("@")){setMsg("Enter a valid email address.");return;}
    btn.disabled=true; const old=btn.textContent; btn.textContent="Checking…";
    try{
      const st=await post("/api/v1/auth/email-status",{email},null,10000);
      if(st?.registered){
        setMsg("This account is already registered. Please use Log In.");
        return;
      }
      const sent=await post("/api/v1/auth/send-email-otp",{email},null,30000);
      if(!sent?.success) throw new Error(sent?.error||"Could not send verification code.");
      signupEmail=email;
      document.getElementById("pardais-signup-email").style.display="none";
      document.getElementById("pardais-signup-otp").style.display="block";
      document.getElementById("pardais-signup-otp-input").focus();
      setMsg("Verification code sent to your email.");
      startTimer(document.getElementById("pardais-signup-resend"),60);
    }catch(e){setMsg(e.message||"Could not send verification code.");}
    finally{btn.disabled=false;btn.textContent=old;}
  };

  async function verifySignupCode(){
    const btn=document.getElementById("pardais-signup-verify");
    const code=document.getElementById("pardais-signup-otp-input").value.trim().replace(/\D/g,"");
    if(code.length!==6){setMsg("Enter the 6-digit verification code.");return;}
    btn.disabled=true; const old=btn.textContent; btn.textContent="Verifying…";
    try{
      let d;
      try {
        d=await post("/api/v1/auth/verify-email-otp",{email:signupEmail,otp:code},null,20000);
      } catch (verifyErr) {
        try {
          const recovery=await post("/api/v1/auth/recover-email-session",{email:signupEmail,otp:code},null,10000);
          if(recovery?.success) d=recovery;
          else throw verifyErr;
        } catch { throw verifyErr; }
      }
      if(!d?.success||!d?.token) throw new Error(d?.error||"Verification failed.");
      saveToken(d.token);
      document.getElementById("pardais-signup-otp").style.display="none";
      document.getElementById("pardais-auth-setup").style.display="block";
      document.getElementById("pardais-name").value=d.user?.fullName||"";
      document.getElementById("pardais-username").value=d.user?.username||"";
      document.getElementById("pardais-dob").value=d.user?.dob||"";
      setMsg("Email verified. Complete your profile.");
    }catch(e){setMsg(e.message||"Verification failed. Please try again.");}
    finally{btn.disabled=false;btn.textContent=old;}
  }
  document.getElementById("pardais-signup-verify").onclick=verifySignupCode;
  document.getElementById("pardais-signup-otp-input").addEventListener("keydown",e=>{if(e.key==="Enter")verifySignupCode()});
  document.getElementById("pardais-signup-resend").onclick=async()=>{
    try{
      const d=await post("/api/v1/auth/send-email-otp",{email:signupEmail},null,30000);
      if(!d?.success) throw new Error(d?.error||"Could not resend verification code.");
      document.getElementById("pardais-signup-otp-input").value="";
      setMsg("New verification code sent.");
      startTimer(document.getElementById("pardais-signup-resend"),60);
    }catch(e){setMsg(e.message||"Could not resend verification code.");}
  };

  document.getElementById("pardais-save-profile").onclick=async()=>{
    const name=document.getElementById("pardais-name").value.trim();
    const username=document.getElementById("pardais-username").value.trim().replace(/^@/,"");
    const dob=document.getElementById("pardais-dob").value;
    if(!name){setMsg("Enter your name.");return;}
    if(!username||username.length<3){setMsg("Enter a username with at least 3 characters.");return;}
    if(!dob){setMsg("Select your date of birth.");return;}
    const t=token();
    if(!t){setMsg("Your verification session expired. Please verify your email again.");return;}
    const btn=document.getElementById("pardais-save-profile"); btn.disabled=true;
    try{
      const d=await post("/api/v1/auth/create-account",{fullName:name,username,dob},t,30000);
      if(!d?.success||!d?.token||!d?.user) throw new Error(d?.error||"Could not create account.");
      finish(d);
    }catch(e){setMsg(e.message||"Could not create account.");}
    finally{btn.disabled=false;}
  };

  // Google/Apple are intentionally disabled until their real integrations are ready.
  document.getElementById("pardais-google-button").onclick=()=>setMsg("Google Sign-In is Coming Soon.");
  document.getElementById("pardais-apple-button").onclick=()=>setMsg("Apple Sign-In is Coming Soon.");
  document.getElementById("pardais-forgot-btn")?.remove();
  tab("login");
})();
</script>
