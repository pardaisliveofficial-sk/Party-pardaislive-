<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#09090e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pardais Party" />
    <link rel="manifest" href="/manifest.json?v=7" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=7" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=7" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-192.png?v=7" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-192.png?v=7" />
    <link rel="shortcut icon" href="/icon-192.png?v=7" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=7" />
    <title>Pardais Party — Where Every Party Comes Alive</title>
  </head>
  <body class="bg-[#09090e] text-white overflow-x-hidden antialiased select-none">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(
            function(reg) { console.log('PWA ServiceWorker registered successfully:', reg.scope); },
            function(err) { console.warn('PWA ServiceWorker registration failed:', err); }
          );
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  
<style id="pardais-auth-gate-style">
#pardais-auth-gate{position:fixed;inset:0;z-index:2147483647;background:linear-gradient(135deg,#080811,#17102b,#071b2f);display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;color:#fff;overflow:auto}
#pardais-auth-card{width:min(430px,100%);background:rgba(20,18,31,.98);border:1px solid rgba(255,0,153,.55);border-radius:24px;padding:28px;box-sizing:border-box;text-align:center;box-shadow:0 20px 70px rgba(0,0,0,.6)}
#pardais-auth-card h1{font-size:27px;margin:8px 0 10px;font-weight:800}
#pardais-auth-card p{color:#aaa5b5;font-size:14px;line-height:1.5}
#pardais-auth-card input{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #3b3747;background:#0d0c13;color:#fff;outline:none;font-size:16px;margin-top:8px;display:block}
#pardais-auth-card input:focus{border-color:#ff0b8a;box-shadow:0 0 0 3px rgba(255,11,138,.12)}
#pardais-auth-card button{width:100%;box-sizing:border-box;padding:14px 16px;border:0;border-radius:12px;background:linear-gradient(90deg,#ff0b8a,#9b30ff);color:#fff;font-weight:800;cursor:pointer;font-size:15px;margin-top:10px}
#pardais-auth-card button:disabled{opacity:.55;cursor:not-allowed}
#pardais-google-button{min-height:44px;display:flex;justify-content:center}
#pardais-auth-or{color:#777185;margin:18px 0;font-weight:700}
#pardais-email-section{display:block;text-align:left}
#pardais-email-label,#pardais-otp-label{display:block;font-size:12px;font-weight:800;color:#c7c1d0;margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em}
#pardais-otp-row{display:block;text-align:left;margin-top:14px}
#pardais-otp{letter-spacing:.3em;text-align:center;font-size:20px;font-weight:800}
#pardais-resend{background:transparent;border:1px solid #3b3747;color:#d7d1df;margin-top:8px}
#pardais-auth-msg{margin-top:14px;color:#ff8fbc;font-size:13px;min-height:20px;line-height:1.4}
#pardais-auth-setup button{width:100%;margin-top:12px}
#pardais-auth-setup{text-align:left}
#pardais-auth-login>div{display:block}
</style>
<div id="pardais-auth-gate">
  <div id="pardais-auth-card">
    <div style="font-size:40px">🎉</div>
    <h1 id="pardais-auth-title">Welcome to Pardais Party</h1>
    <p id="pardais-auth-subtitle">Sign in or create your account to continue.</p>
    <div id="pardais-auth-login">
      <div id="pardais-google-button"></div>
      <div id="pardais-auth-or">OR</div>
      <div id="pardais-email-section">
        <label id="pardais-email-label" for="pardais-email">Email address</label>
        <input id="pardais-email" type="email" placeholder="name@example.com" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false">
        <button id="pardais-send" type="button">Send verification code</button>
      </div>
      <div id="pardais-otp-row" style="display:none">
        <label id="pardais-otp-label" for="pardais-otp">Verification code</label>
        <input id="pardais-otp" type="text" maxlength="6" placeholder="6-digit code" inputmode="numeric" autocomplete="one-time-code">
        <button id="pardais-verify" type="button">Verify & Continue</button>
        <button id="pardais-resend" type="button" disabled>Resend code (60s)</button>
      </div>
    </div>
    <div id="pardais-auth-setup" style="display:none">
      <p>Your email is verified. Create your permanent Pardais Party account.</p>
      <label id="pardais-email-label">Full name</label>
      <input id="pardais-name" placeholder="Your name" autocomplete="name">
      <label id="pardais-email-label" style="margin-top:10px">Username</label>
      <input id="pardais-username" placeholder="@username" autocomplete="username">
      <label id="pardais-email-label" style="margin-top:10px">Create password</label>
      <input id="pardais-create-password" type="password" placeholder="At least 6 characters" autocomplete="new-password">
      <label id="pardais-email-label" style="margin-top:10px">Confirm password</label>
      <input id="pardais-confirm-password" type="password" placeholder="Repeat password" autocomplete="new-password">
      <button id="pardais-save-profile" type="button">Create Pardais Account</button>
    </div>
    <div id="pardais-auth-msg"></div>
  </div>
</div>
<script>
(function(){
  const API="https://api.pardaisparty.soulverseapps.com";
  const gate=document.getElementById("pardais-auth-gate");
  const msg=document.getElementById("pardais-auth-msg");
  const login=document.getElementById("pardais-auth-login");
  const setup=document.getElementById("pardais-auth-setup");
  const email=document.getElementById("pardais-email");
  const otp=document.getElementById("pardais-otp");
  const sendBtn=document.getElementById("pardais-send");
  const verifyBtn=document.getElementById("pardais-verify");
  const resendBtn=document.getElementById("pardais-resend");
  let resendTimer=null, currentEmail="";

  const setMsg=x=>msg.textContent=x||"";
  const token=()=>localStorage.getItem("pardais_auth_token");
  const saveToken=t=>localStorage.setItem("pardais_auth_token",t);

  async function post(path,body){
    let r;
    try{
      r=await fetch(API+path,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(body)});
    }catch(e){throw new Error("Unable to connect to Pardais Party server.");}
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error||d.message||("Server error ("+r.status+")"));
    return d;
  }

  function startResendTimer(){
    let seconds=60;
    resendBtn.disabled=true;
    resendBtn.textContent="Resend code ("+seconds+"s)";
    clearInterval(resendTimer);
    resendTimer=setInterval(()=>{
      seconds--;
      if(seconds<=0){
        clearInterval(resendTimer);
        resendBtn.disabled=false;
        resendBtn.textContent="Resend verification code";
      }else resendBtn.textContent="Resend code ("+seconds+"s)";
    },1000);
  }

  function showPasswordLogin(){
    login.style.display="block";
    setup.style.display="none";
    document.getElementById("pardais-otp-row").style.display="none";
    document.getElementById("pardais-auth-title").textContent="Welcome back";
    document.getElementById("pardais-auth-subtitle").textContent="Enter your password to open your existing Pardais account.";
    sendBtn.textContent="Continue";
    setMsg("");
    email.value=currentEmail;
    email.disabled=true;
    const existing=login.querySelector("#pardais-password-login");
    if(existing) existing.focus();
  }

  function showCreateAccount(){
    login.style.display="none";
    setup.style.display="block";
    document.getElementById("pardais-auth-title").textContent="Create your Pardais Account";
    document.getElementById("pardais-auth-subtitle").textContent="This account will stay linked to this email permanently.";
    document.getElementById("pardais-name").focus();
  }

  function finish(d){
    if(d.token) saveToken(d.token);
    window.__pardaisAuthenticatedUser=d.user||{};
    gate.remove();
  }

  async function restore(){
    const t=token();
    if(!t) return;
    try{
      const r=await fetch(API+"/api/v1/auth/me",{headers:{Authorization:"Bearer "+t}});
      if(!r.ok) throw new Error();
      const d=await r.json();
      window.__pardaisAuthenticatedUser=d.user;
      gate.remove();
    }catch(e){
      localStorage.removeItem("pardais_auth_token");
    }
  }

  async function continueEmail(){
    const value=email.value.trim().toLowerCase();
    if(!value || !value.includes("@") || !value.includes(".")){
      setMsg("Please enter your complete email address."); return;
    }
    currentEmail=value;
    try{
      setMsg("Checking account…");
      const status=await post("/api/v1/auth/email-status",{email:value});
      if(status.exists && !status.needsPassword){
        showPasswordLogin();
        return;
      }
      // New email (or an older email account without a password):
      // send ONE verification code, then create/complete the permanent account.
      await post("/api/v1/auth/send-email-otp",{email:value});
      document.getElementById("pardais-otp-row").style.display="block";
      document.getElementById("pardais-email-section").style.display="none";
      passwordBox.style.display="none";
      document.getElementById("pardais-auth-title").textContent="Verify your email";
      document.getElementById("pardais-auth-subtitle").textContent="Enter the code sent to "+value;
      document.getElementById("pardais-otp-label").textContent="Verification code";
      document.getElementById("pardais-verify").textContent="Verify & Create Account";
      setMsg("Verification code sent. Check your email.");
      otp.focus();
      startResendTimer();
    }catch(e){setMsg(e.message||"Unable to continue.");}
  }

  // Build password field + create account / forgot password controls dynamically.
  const passwordBox=document.createElement("div");
  passwordBox.innerHTML=
    '<input id="pardais-password-login" type="password" placeholder="Password" autocomplete="current-password">'+
    '<button id="pardais-login-password" type="button">Login</button>'+
    '<button id="pardais-forgot" type="button" style="background:transparent;border:1px solid #3b3747;color:#ddd">Forgot password?</button>'+
    '<button id="pardais-create-new" type="button" style="background:transparent;border:1px solid #3b3747;color:#ddd">Create account with this email</button>';
  login.insertBefore(passwordBox,document.getElementById("pardais-email-section"));
  passwordBox.style.display="none";

  const passwordInput=()=>document.getElementById("pardais-password-login");

  async function loginPassword(){
    try{
      setMsg("Signing in…");
      const d=await post("/api/v1/auth/password-login",{email:currentEmail,password:passwordInput().value});
      finish(d);
    }catch(e){setMsg(e.message||"Incorrect email or password.");}
  }

  async function sendRegistrationCode(){
    const value=email.value.trim().toLowerCase();
    if(!value || !value.includes("@") || !value.includes(".")){setMsg("Please enter a valid email.");return;}
    currentEmail=value;
    try{
      setMsg("Sending verification code…");
      const d=await post("/api/v1/auth/send-email-otp",{email:value});
      document.getElementById("pardais-otp-row").style.display="block";
      login.style.display="block";
      passwordBox.style.display="none";
      document.getElementById("pardais-auth-title").textContent="Verify your email";
      document.getElementById("pardais-auth-subtitle").textContent="Enter the code sent to "+value;
      sendBtn.style.display="none";
      document.getElementById("pardais-email-section").style.display="none";
      setMsg("Code sent. Check your email.");
      otp.focus();
      startResendTimer();
    }catch(e){setMsg(e.message||"Could not send verification code.");}
  }

  document.getElementById("pardais-send").onclick=continueEmail;
  email.addEventListener("keydown",e=>{if(e.key==="Enter")continueEmail();});

  // Password screen is shown after email check.
  function revealPasswordControls(){
    passwordBox.style.display="block";
    passwordInput().focus();
  }

  // Override showPasswordLogin to reveal the actual password UI.
  const oldShow=showPasswordLogin;
  window.__showPardaisPassword=()=>{
    passwordBox.style.display="block";
    oldShow();
    passwordBox.style.display="block";
    passwordInput().focus();
  };

  document.getElementById("pardais-login-password").onclick=loginPassword;
  passwordInput().addEventListener("keydown",e=>{if(e.key==="Enter")loginPassword();});

  let recoveryMode=false;
  const resetPasswordInput=document.createElement("input");
  resetPasswordInput.id="pardais-reset-password";
  resetPasswordInput.type="password";
  resetPasswordInput.placeholder="New password";
  resetPasswordInput.autocomplete="new-password";
  resetPasswordInput.style.display="none";
  login.appendChild(resetPasswordInput);

  document.getElementById("pardais-forgot").onclick=async()=>{
    const value=currentEmail||email.value.trim().toLowerCase();
    if(!value){setMsg("Enter your email first.");return;}
    try{
      setMsg("Sending recovery code…");
      await post("/api/v1/auth/forgot-password",{email:value});
      recoveryMode=true;
      resetPasswordInput.style.display="block";
      login.style.display="block";
      passwordBox.style.display="none";
      document.getElementById("pardais-email-section").style.display="none";
      document.getElementById("pardais-otp-row").style.display="block";
      document.getElementById("pardais-auth-title").textContent="Reset your password";
      document.getElementById("pardais-auth-subtitle").textContent="Enter the recovery code sent to "+value;
      document.getElementById("pardais-otp-label").textContent="Recovery code";
      document.getElementById("pardais-verify").textContent="Reset Password";
      setMsg("Recovery code sent.");
      startResendTimer();
      otp.focus();
    }catch(e){setMsg(e.message||"Could not send recovery code.");}
  };

  document.getElementById("pardais-create-new").onclick=sendRegistrationCode;

  verifyBtn.onclick=async()=>{
    const value=currentEmail||email.value.trim().toLowerCase(), code=otp.value.trim();
    if(code.length!==6){setMsg("Enter the 6-digit code.");return;}
    try{
      setMsg(recoveryMode ? "Resetting password…" : "Verifying code…");
      if(recoveryMode){
        const newPassword=resetPasswordInput.value;
        if(newPassword.length<6) throw new Error("New password must be at least 6 characters.");
        const d=await post("/api/v1/auth/reset-password",{email:value,otp:code,password:newPassword});
        finish(d);
        return;
      }
      const d=await post("/api/v1/auth/verify-email-otp",{email:value,otp:code});
      if(d.needsPassword || d.isNewUser){
        saveToken(d.token);
        showCreateAccount();
      }else{
        finish(d);
      }
    }catch(e){setMsg(e.message||"Verification failed.");}
  };;

  resendBtn.onclick=sendRegistrationCode;
  otp.addEventListener("input",()=>{otp.value=otp.value.replace(/\D/g,"").slice(0,6);});

  document.getElementById("pardais-save-profile").onclick=async()=>{
    const name=document.getElementById("pardais-name").value.trim();
    const username=document.getElementById("pardais-username").value.trim().replace(/^@/,"");
    const password=document.getElementById("pardais-create-password").value;
    const confirm=document.getElementById("pardais-confirm-password").value;
    if(!name){setMsg("Enter your name.");return;}
    if(username.length<3){setMsg("Username must be at least 3 characters.");return;}
    if(password.length<6){setMsg("Password must be at least 6 characters.");return;}
    if(password!==confirm){setMsg("Passwords do not match.");return;}
    try{
      setMsg("Creating your permanent account…");
      const t=token();
      const passResponse=await fetch(API+"/api/v1/auth/set-password",{
        method:"POST",
        headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},
        body:JSON.stringify({password})
      });
      const p=await passResponse.json().catch(()=>({}));
      if(!passResponse.ok) throw new Error(p.error||"Could not create password.");
      // Profile setup uses the same verified account token.
      const profile=await fetch(API+"/api/v1/auth/setup-profile",{
        method:"POST",
        headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},
        body:JSON.stringify({fullName:name,username})
      });
      const out=await profile.json().catch(()=>({}));
      if(!profile.ok) throw new Error(out.error||"Could not save profile.");
      finish({token:t,user:out.user});
    }catch(e){setMsg(e.message||"Could not create account.");}
  };

  // First page: email only. Returning users get password; new users explicitly choose Create account.
  document.getElementById("pardais-auth-title").textContent="Welcome to Pardais Party";
  restore();
})();
</script>
</body>
</html>
