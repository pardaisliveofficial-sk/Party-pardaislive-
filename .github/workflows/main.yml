name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build Native Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "Install Dependencies (production source: v58src)"
        run: |
          set -euo pipefail
          cd v58src
          npm install --include=dev --no-audit --no-fund --legacy-peer-deps

          # Explicitly install Sharp because the Android asset generator requires
          # the native 'sharp' module at runtime. This also repairs environments
          # where npm is configured to omit devDependencies.
          npm install sharp@0.35.3 --save-dev --include=dev --no-audit --no-fund --legacy-peer-deps

          node -e "console.log('✅ Sharp resolved at:', require.resolve('sharp'))"

      - name: Recreate Android Assets from SVG (Icons & Splash)
        run: cd v58src && node android-recreate-icons.cjs

      - name: Build Web Application
        run: cd v58src && npm run build

      - name: Sync Assets to Android Native
        run: cd v58src && npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Download Valid Gradle Wrapper JAR
        run: |
          curl -L https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradle/wrapper/gradle-wrapper.jar -o v58src/android/gradle/wrapper/gradle-wrapper.jar

      - name: Grant Execute Permission to Gradlew
        run: chmod +x v58src/android/gradlew

      - name: Configure Android Signing Key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
          RELEASE_STORE_TYPE: ${{ secrets.RELEASE_STORE_TYPE || 'JKS' }}
        run: |
          set -euo pipefail
          mkdir -p v58src/android/app
          rm -f v58src/android/app/release.keystore v58src/android/app/release-key.jks v58src/android/app/release-custom.keystore v58src/android/app/*.p12

          # Production builds MUST use the configured Play Console upload keystore.
          # Never generate a temporary signing key: it would produce an unusable release identity.
          for required in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!required:-}" ]; then
              echo "❌ Missing GitHub Actions secret: $required (or its supported fallback name)."
              exit 1
            fi
          done

          echo "Decoding configured release keystore..."
          if ! printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > v58src/android/app/release-custom.keystore; then
            echo "❌ RELEASE_KEYSTORE_BASE64 is not valid Base64."
            exit 1
          fi

          if [ ! -s v58src/android/app/release-custom.keystore ]; then
            echo "❌ Decoded release keystore is empty."
            exit 1
          fi

          echo "Validating configured release keystore..."
          if ! keytool -list -keystore v58src/android/app/release-custom.keystore -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" > /dev/null 2>&1; then
            echo "❌ Release keystore validation failed. Check the keystore Base64, store password and alias GitHub secrets."
            exit 1
          fi

          echo "✅ Configured release keystore validated. Using it for APK/AAB signing."
          echo "RELEASE_STORE_FILE=release-custom.keystore" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_TYPE=$RELEASE_STORE_TYPE" >> "$GITHUB_ENV"

          echo "Final keystore check..."
          keytool -list -keystore v58src/android/app/release-custom.keystore -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" | grep -E 'Alias name:|Entry type:|SHA256:' || true

      - name: Build Android Release APK (Signed)
        run: |
          cd v58src/android
          ./gradlew assembleRelease

      - name: Build Android Release App Bundle (AAB)
        run: |
          cd v58src/android
          ./gradlew bundleRelease

      - name: Build Android Debug APK (Immediately Installable)
        run: |
          cd v58src/android
          ./gradlew assembleDebug

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pardais-party-release-apk
          path: v58src/android/app/build/outputs/apk/release/*.apk

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pardais-party-release-aab
          path: v58src/android/app/build/outputs/bundle/release/*.aab

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pardais-party-debug-apk
          path: v58src/android/app/build/outputs/apk/debug/*.apk


          
