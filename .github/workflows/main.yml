name: Build Android APK & AAB

on:
  push:
    branches: [ main, master, Staging ]
  pull_request:
    branches: [ main, master, Staging ]

jobs:
  build:
    name: Build Native Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          # Always resolve from package.json. This avoids stale lock-file failures
          # after dependency updates and keeps CI reproducible from the declared manifest.
          npm install --no-audit --no-fund --legacy-peer-deps --include=optional

      - name: Recreate Android Assets from SVG (Icons & Splash)
        run: node android-recreate-icons.cjs

      - name: Verify animation dependencies
        run: |
          node -e "const p=require('./package.json'); const d={...(p.dependencies||{}),...(p.devDependencies||{})}; for (const n of ['motion']) { if (!d[n]) { console.error('Missing animation dependency: '+n); process.exit(1); } } console.log('Animation dependencies OK: motion + framer-motion')"
          npm ls motion framer-motion --depth=0 || npm install motion@13.1.1 framer-motion@13.1.1 --no-audit --no-fund --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Assets to Android Native
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Download Valid Gradle Wrapper JAR
        run: |
          curl -L https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradle/wrapper/gradle-wrapper.jar -o android/gradle/wrapper/gradle-wrapper.jar

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Configure Android Signing Key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/app
          rm -f android/app/release.keystore android/app/release-key.jks android/app/release-custom.keystore android/app/*.p12

          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "❌ RELEASE_KEYSTORE_BASE64/KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          if [ -z "$RELEASE_STORE_PASSWORD" ]; then
            echo "❌ RELEASE_STORE_PASSWORD/KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi
          if [ -z "$RELEASE_KEY_ALIAS" ]; then
            echo "❌ RELEASE_KEY_ALIAS/KEY_ALIAS secret is missing."
            exit 1
          fi
          if [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "❌ RELEASE_KEY_PASSWORD/KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "Decoding supplied release keystore..."
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/release-custom.keystore

          if [ ! -s android/app/release-custom.keystore ]; then
            echo "❌ Decoded keystore is missing or empty."
            exit 1
          fi

          if ! keytool -list -keystore android/app/release-custom.keystore -storepass "$RELEASE_STORE_PASSWORD" >/dev/null 2>&1; then
            echo "❌ Supplied keystore/password could not be validated."
            exit 1
          fi

          if ! keytool -list -keystore android/app/release-custom.keystore -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null 2>&1; then
            echo "❌ Supplied key alias could not be validated."
            exit 1
          fi

          echo "RELEASE_STORE_FILE=release-custom.keystore" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_TYPE=JKS" >> "$GITHUB_ENV"
          echo "✅ Supplied GitHub release keystore validated successfully."

      - name: Build Android Release APK (Signed)
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Build Android Release App Bundle (AAB)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Build Android Debug APK (Immediately Installable)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pardais-party-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pardais-party-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pardais-party-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

          
