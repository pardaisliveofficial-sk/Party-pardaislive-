name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build Native Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          # Always resolve from package.json. This avoids stale lock-file failures
          # after dependency updates and keeps CI reproducible from the declared manifest.
          npm install --no-audit --no-fund --legacy-peer-deps

      - name: Recreate Android Assets from SVG (Icons & Splash)
        run: node android-recreate-icons.cjs

      - name: Build Web Application
        run: npm run build

      - name: Sync Assets to Android Native
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Download Valid Gradle Wrapper JAR
        run: |
          curl -L https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradle/wrapper/gradle-wrapper.jar -o android/gradle/wrapper/gradle-wrapper.jar

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Configure Android Signing Key
        env:
          # Support the same secret names used by the previously working signed build.
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS || 'pardais-upload' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
          RELEASE_STORE_TYPE: ${{ secrets.RELEASE_STORE_TYPE || 'JKS' }}
        run: |
          set -euo pipefail
          mkdir -p android/app
          rm -f android/app/release-key.jks android/app/release.keystore android/app/release-custom.keystore android/app/*.p12

          # Use ONLY the GitHub Secrets supplied by the repository.
          # Never generate a fallback signing key and never assume a password/alias.
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "❌ $name secret is missing or empty."
              exit 1
            fi
          done

          echo "Decoding release keystore from GitHub Secret..."
          # Strip accidental whitespace/newlines introduced when copying the Base64 value.
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/release-key.jks

          if [ ! -s android/app/release-key.jks ]; then
            echo "❌ Decoded keystore is missing or empty."
            exit 1
          fi

          echo "Validating supplied keystore..."
          STORE_TYPE=""
          if [ "$RELEASE_STORE_TYPE" = "PKCS12" ] && keytool -list -keystore android/app/release-key.jks -storetype PKCS12 -storepass "$RELEASE_STORE_PASSWORD" >/dev/null 2>&1; then
            STORE_TYPE="PKCS12"
          elif [ "$RELEASE_STORE_TYPE" = "JKS" ] && keytool -list -keystore android/app/release-key.jks -storetype JKS -storepass "$RELEASE_STORE_PASSWORD" >/dev/null 2>&1; then
            STORE_TYPE="JKS"
          else
            if keytool -list -keystore android/app/release-key.jks -storetype PKCS12 -storepass "$RELEASE_STORE_PASSWORD" >/dev/null 2>&1; then
              STORE_TYPE="PKCS12"
            elif keytool -list -keystore android/app/release-key.jks -storetype JKS -storepass "$RELEASE_STORE_PASSWORD" >/dev/null 2>&1; then
              STORE_TYPE="JKS"
            else
              echo "❌ The supplied keystore cannot be opened with the supplied store password."
              exit 1
            fi
          fi

          if ! keytool -list -keystore android/app/release-key.jks -storetype "$STORE_TYPE" -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null 2>&1; then
            echo "❌ RELEASE_KEY_ALIAS does not exist in the supplied keystore."
            exit 1
          fi

          echo "Validating key password..."
          if ! keytool -certreq -keystore android/app/release-key.jks -storetype "$STORE_TYPE" -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" -keypass "$RELEASE_KEY_PASSWORD" -file /tmp/pardais-signing.csr -dname "CN=Pardais Party" >/dev/null 2>&1; then
            echo "❌ RELEASE_KEY_PASSWORD does not match the selected key."
            rm -f /tmp/pardais-signing.csr
            exit 1
          fi
          rm -f /tmp/pardais-signing.csr

          echo "RELEASE_STORE_FILE=release-key.jks" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_TYPE=$STORE_TYPE" >> "$GITHUB_ENV"
          echo "✅ Supplied GitHub signing keystore configured successfully."

      - name: Build Android Release APK (Signed)
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Build Android Release App Bundle (AAB)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Build Android Debug APK (Immediately Installable)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pardais-party-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pardais-party-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pardais-party-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

          
